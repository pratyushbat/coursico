<!-- index.html -->
<div class="login-container">
  <div class="login-card">
    <div class="login-left">
      <h1>Welcome Back</h1>
      <p>
        Sign in to continue accessing your dashboard and manage everything in one place.
      </p>
    </div>

    <div class="login-right">
      <h2>Login</h2>

      <form (ngSubmit)="submitLogin()">
        <div class="input-group">
          <input name="number" type="number" [(ngModel)]="phoneNumber" [ngModelOptions]="{standalone: true}"  placeholder="Phone Number" required/>
        </div>

        <div class="input-group">
          <input type="password" name="Password" [attr.type]="true ? 'text' : 'password'" [(ngModel)]="password" placeholder="Password" required />
        </div>

        <div class="options">
          <label>
            <input type="checkbox" />
            Remember me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Sign In</button>

        <p class="signup-text">
          Don't have an account?
          <a href="#">Create Account</a>
        </p>
      </form>
    </div>
  </div>
</div>
